name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar sintaxe e que app.js corresponde a src/
        run: node --check app.js && node --check sw.js && node scripts/build.mjs --check
      - run: npm ci
      - name: Instalar o Chromium e o WebKit (Safari)
        run: npx playwright install --with-deps chromium webkit
      - name: Correr os testes
        run: npx playwright test
      - name: Guardar o relatório (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: |
            playwright-report/
            test-results/
          retention-days: 7
